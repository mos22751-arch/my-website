<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TOJI — Mohamed Mostafa, Freelance Web Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- شبكة نقط خفيفة جدًا، إحساس تقني هادي بدون ألوان -->
  <g opacity="0.06">
    <circle cx="120" cy="90" r="2" fill="#ffffff"/>
    <circle cx="1080" cy="540" r="2" fill="#ffffff"/>
    <circle cx="1000" cy="80" r="2" fill="#ffffff"/>
    <circle cx="150" cy="560" r="2" fill="#ffffff"/>
  </g>

  <!-- لوحة الزجاج المركزية -->
  <rect x="120" y="120" width="960" height="390" rx="40" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M 160 165 Q 600 130 1040 165" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" fill="none" stroke-linecap="round"/>

  <text x="600" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="800" letter-spacing="8" fill="#f5f5f4">TOJI</text>
  <circle cx="600" cy="335" r="6" fill="#e5e7eb"/>

  <text x="600" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" letter-spacing="1" fill="#a8a8ad">Freelance Web Developer — Mohamed Mostafa</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#6f6f75">Portfolios · Landing Pages · Link Hubs</text>
</svg>
