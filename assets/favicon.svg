<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TOJI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- خلفية داكنة صافية، زي متغير خلفية الموقع -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- لوحة زجاج شفافة نضيفة (Liquid Glass) — بلا أي توهج ملون -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- خط علوي رفيع بيدي إحساس انعكاس الزجاج -->
  <path d="M 72 112 Q 256 76 440 112" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- TOJI wordmark -->
  <text x="256" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" letter-spacing="6" fill="#f5f5f4">TOJI</text>

  <!-- نقطة محايدة صغيرة بدل التوهج القديم -->
  <circle cx="256" cy="360" r="7" fill="#e5e7eb"/>
</svg>
